<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="globe" x1="35" y1="10" x2="91" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE49A"/>
      <stop offset=".55" stop-color="#F8C84B"/>
      <stop offset="1" stop-color="#E5A411"/>
    </linearGradient>
    <linearGradient id="leftGold" x1="36" y1="49" x2="61" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9C83F"/>
      <stop offset="1" stop-color="#D78A08"/>
    </linearGradient>
    <linearGradient id="rightGold" x1="69" y1="46" x2="64" y2="101" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7A0"/>
      <stop offset="1" stop-color="#F0B625"/>
    </linearGradient>
  </defs>

  <!-- A bold, game-readable redraw: globe, twisting sculptural body, green-ringed base. -->
  <path d="M64 7C45 7 32 20 32 37c0 16 13 27 32 27s32-11 32-27C96 20 83 7 64 7Z" fill="url(#globe)" stroke="#153C32" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M47 12c1 7 7 8 7 14 0 4-4 6-2 10 3 5 10 0 15 4 4 3 4 8 10 10 5 2 11-1 17 1" stroke="#153C32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 29c6 1 10 4 12 8 2 5 0 10 3 15m30-41c-3 7-1 12 5 16 5 3 8 7 10 12" stroke="#153C32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three uneven panels wrap around one another instead of forming a generic symmetric cup. -->
  <path d="M35 47c2 18 4 35 17 54l12-13c-8-14-10-28-10-43-7 4-12 5-19 2Z" fill="url(#leftGold)" stroke="#153C32" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M54 45c0 16 3 31 10 43 6-11 10-25 12-42-8 3-14 2-22-1Z" fill="#FFD86A" stroke="#153C32" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M76 46c-2 19-7 34-24 55l13 7c18-20 25-40 28-61-7 3-11 2-17-1Z" fill="url(#rightGold)" stroke="#153C32" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M40 55c3 14 7 27 13 38M84 54c-3 15-9 31-21 45" stroke="#FFF2B5" stroke-width="2.3" stroke-linecap="round" opacity=".75"/>

  <!-- Broad stepped plinth with the two green bands that make the trophy recognizable at small sizes. -->
  <path d="M52 99h25l8 10H43Z" fill="#F4BE35" stroke="#153C32" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M43 108h42l5 12H38Z" fill="#EAB129" stroke="#153C32" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M41 109h46l2 5H39Z" fill="#58B92D"/>
  <path d="M39 116h50l1 4H38Z" fill="#58B92D"/>
</svg>
