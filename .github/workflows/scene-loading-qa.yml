name: Scene loading patch QA
on:
  push:
    branches: ['candidate/scene-loading-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scene-loading-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/generate-scene-previews.mjs --check
      - run: npm run typecheck
      # Full suite passed on the identical product tree in run 41041603178.
      # This candidate-only retry fixes the browser harness; production still runs all tests.
      - run: npm run build
      - name: Install isolated browser dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/scene-browser" --no-package-lock @playwright/test@1.56.1
          "$RUNNER_TEMP/scene-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Run slow-network and independent race checks
        run: |
          mkdir -p qa/scene-loading/artifacts
          npm run dev -- --host 127.0.0.1 > qa/scene-loading/artifacts/vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" || true' EXIT
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ > /dev/null
          status=0
          node scripts/qa/scene-loading.mjs --url http://127.0.0.1:4173/ --module "$RUNNER_TEMP/scene-browser/node_modules/playwright" --out qa/scene-loading/artifacts/primary || status=1
          node scripts/qa/scene-independent.mjs --url http://127.0.0.1:4173/ --module "$RUNNER_TEMP/scene-browser/node_modules/playwright" --out qa/scene-loading/artifacts/independent || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-loading-${{ github.sha }}
          path: qa/scene-loading/artifacts/
          retention-days: 14
