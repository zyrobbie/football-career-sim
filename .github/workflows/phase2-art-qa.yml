name: Phase2 approved illustration QA
on:
  push:
    branches: ['candidate/phase2-art-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-illustration-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --config qa/phase2-art/vitest.config.ts
      - run: npm run build
      - name: Install isolated browser dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/phase2-browser" --no-package-lock @playwright/test@1.56.1
          mkdir -p node_modules/@playwright
          ln -s "$RUNNER_TEMP/phase2-browser/node_modules/@playwright/test" node_modules/@playwright/test
          "$RUNNER_TEMP/phase2-browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: node qa/phase2-art/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-art-${{ github.sha }}
          path: qa/phase2-art/artifacts/
          retention-days: 14
