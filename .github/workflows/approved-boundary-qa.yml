name: Approved edit breakpoint diagnosis
on:
  push:
    branches: ['candidate/approved-boundary-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  component-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render fresh anonymous component-only scenarios
        run: npx vitest run --config qa/approved-edits/vitest.config.ts
      - name: Install isolated browser dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/layout-browser" --no-package-lock @playwright/test@1.56.1
          mkdir -p node_modules/@playwright
          ln -s "$RUNNER_TEMP/layout-browser/node_modules/@playwright/test" node_modules/@playwright/test
          "$RUNNER_TEMP/layout-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Chinese font support
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 320 to 430 CSS pixels and text-only 200 percent layout checks
        run: node qa/approved-boundary/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-diagnosis-${{ github.sha }}
          path: qa/approved-boundary/artifacts/
          if-no-files-found: warn
          retention-days: 14
